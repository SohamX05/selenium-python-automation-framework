[pytest]
testpaths = tests unittest_demo.py
python_files = test_*.py unittest_demo.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    login: login page scenarios
    search: product search scenarios
    registration: tests that create a fresh throwaway account on the demo site
    failure_demo: intentionally failing test used to demonstrate screenshots on failure
