; Central configuration for the framework.
; Change values here instead of editing code.

[DEFAULT]
base_url = https://tutorialsninja.com/demo/
; Supported: chrome, edge
browser = chrome
; Explicit-wait timeout in seconds
timeout = 10
; true = run without opening a visible browser window
headless = false
; Folder (relative to project root) where failure screenshots are saved
screenshot_dir = screenshots
